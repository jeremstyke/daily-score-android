name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Build the signed app
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          echo "$KEYSTORE_B64" | base64 -d > android.keystore
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          yes | bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          ls -la *.apk *.aab
      - uses: actions/upload-artifact@v4
        with:
          name: daily-score-android
          path: |
            app-release-signed.apk
            app-release-bundle.aab
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Daily Score Android 1.0.${{ github.run_number }}
          files: |
            app-release-signed.apk
            app-release-bundle.aab
